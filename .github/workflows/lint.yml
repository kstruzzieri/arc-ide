name: Lint

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.Codex/**'
      - '.claude/**'
  # No `branches:` filter: that filter matches the PR's BASE branch, so scoping
  # it to [main, develop] gave stacked PRs (base = another feature branch) zero
  # checks and a mergeable "no checks reported" state. The narrow `push` filter
  # above is what keeps this from double-running on feature-branch pushes.
  # No `paths-ignore` either: branch protection requires these checks, and a
  # filtered-out PR never reports them -- it would sit "Expected" forever and
  # be unmergeable. Docs-only PRs pay one short CI run instead.
  pull_request:

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  golangci-lint:
    name: golangci-lint
    # Pinned to 22.04: the image IS the WebKit2GTK 4.1 compatibility floor
    # that the gtk3 build-tags below target.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: go.sum

      - name: Setup Node.js (for frontend build)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies for Wails
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend (required for go:embed)
        run: |
          cd frontend
          npm run build

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Pinned (with .golangci.yml version "2") so CI and the local
          # .husky/pre-push hook run identical checks.
          version: v2.11.4
          # Skip the action's remote JSON-schema fetch for config validation:
          # that network call to golangci-lint.run times out intermittently and
          # fails otherwise-green runs. golangci-lint still errors on a genuinely
          # broken config at runtime.
          verify: false
          # Cached Staticcheck facts produced different SA5011 results for the
          # same source tree across otherwise-identical Actions runs.
          skip-cache: true
